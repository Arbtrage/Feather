[package]
name = "feather-server"
version = "0.1.0"
edition = "2021"
description = "Feather durable execution platform — control plane server"

[[bin]]
name = "feather-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
deadpool-redis = "0.18"
prost = "0.13"
prost-types = "0.13"
redis = { version = "0.27", features = ["tokio-comp"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tonic = "0.12"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tokio-test = "0.4"
uuid = { version = "1", features = ["v7"] }

[lib]
name = "feather_server"
path = "src/lib.rs"
