[project]
name = "feather-sdk"
version = "0.1.0"
description = "Feather durable execution platform — Python SDK"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "grpcio>=1.62",
    "grpcio-tools>=1.62",
    "protobuf>=5.29",
]

[project.urls]
Repository = "https://github.com/your-org/feather"
Documentation = "https://github.com/your-org/feather/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["feather"]

[tool.hatch.build.targets.wheel.force-include]
"feather/proto" = "feather/proto"

[tool.hatch.build.targets.sdist]
include = ["feather/**/*.py", "feather/proto/**/*.proto"]
