[project]
name = "getfeather"
version = "0.2.0"
description = "Feather durable execution platform — Python SDK"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "grpcio>=1.62",
    "grpcio-tools>=1.62",
    "protobuf>=5.29",
]

[project.urls]
Repository = "https://github.com/Arbtrage/Feather"
Documentation = "https://docs.feather.dev"
Homepage = "https://feather.dev"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["getfeather"]

[tool.hatch.build.targets.wheel.force-include]
"getfeather/ui_static" = "getfeather/ui_static"

[tool.hatch.build.targets.sdist]
include = ["getfeather/**/*.py", "getfeather/proto/**/*.proto", "getfeather/ui_static/**/*"]

[tool.hatch.build.targets.sdist.force-include]
"getfeather/ui_static" = "getfeather/ui_static"
