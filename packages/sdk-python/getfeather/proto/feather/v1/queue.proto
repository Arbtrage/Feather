syntax = "proto3";

package feather.v1;

import "feather/v1/job.proto";
import "google/protobuf/timestamp.proto";

service QueueService {
  rpc Enqueue(EnqueueRequest) returns (EnqueueResponse);
  rpc Dequeue(DequeueRequest) returns (DequeueResponse);
  rpc Ack(AckRequest) returns (AckResponse);
  rpc Nack(NackRequest) returns (NackResponse);
  rpc ExtendLease(ExtendLeaseRequest) returns (ExtendLeaseResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
}

message EnqueueRequest {
  string queue = 1;
  string name = 2;
  bytes payload = 3;
  int32 priority = 4;
}

message EnqueueResponse {
  string job_id = 1;
  google.protobuf.Timestamp created_at = 2;
}

message DequeueRequest {
  string worker_id = 1;
  repeated string queues = 2;
  int32 wait_timeout_ms = 3;
  int32 max_jobs = 4;
}

message DequeueResponse {
  Job job = 1;
  int32 backoff_hint_ms = 2;
  bool slow_down = 3;
  repeated Job jobs = 4;
}

message AckRequest {
  string job_id = 1;
  string worker_id = 2;
}

message AckResponse {}

message NackRequest {
  string job_id = 1;
  string worker_id = 2;
  string reason = 3;
  bool retryable = 4;
  string failure_class = 5;
}

message NackResponse {}

message ExtendLeaseRequest {
  string job_id = 1;
  string worker_id = 2;
  int32 extension_ms = 3;
}

message ExtendLeaseResponse {
  google.protobuf.Timestamp lease_expires_at = 1;
}

message GetJobRequest {
  string job_id = 1;
}

message GetJobResponse {
  Job job = 1;
}
