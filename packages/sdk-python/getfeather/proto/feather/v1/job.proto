syntax = "proto3";

package feather.v1;

import "google/protobuf/timestamp.proto";

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_PENDING = 1;
  JOB_STATE_LEASED = 2;
  JOB_STATE_COMPLETED = 3;
  JOB_STATE_FAILED = 4;
}

message Job {
  string id = 1;
  string queue = 2;
  string name = 3;
  bytes payload = 4;
  JobState state = 5;
  int32 priority = 6;
  int32 attempt = 7;
  google.protobuf.Timestamp lease_expires_at = 8;
  google.protobuf.Timestamp created_at = 9;
  string worker_id = 10;
  string workflow_run_id = 11;
  string activity_id = 12;
}

message RetryPolicy {
  int64 base_delay_ms = 1;
  int64 max_delay_ms = 2;
  int32 max_attempts = 3;
}
