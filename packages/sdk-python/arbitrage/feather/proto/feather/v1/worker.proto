syntax = "proto3";

package feather.v1;

import "feather/v1/common.proto";

service WorkerService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc Deregister(DeregisterRequest) returns (DeregisterResponse);
}

enum WorkerStatus {
  WORKER_STATUS_UNSPECIFIED = 0;
  WORKER_STATUS_ACTIVE = 1;
  WORKER_STATUS_DRAINING = 2;
  WORKER_STATUS_OFFLINE = 3;
}

message RegisterRequest {
  string worker_id = 1;
  repeated string queues = 2;
  repeated string capabilities = 3;
  map<string, string> labels = 4;
  ResourceProfile resource_profile = 5;
  map<string, string> metadata = 6;
}

message RegisterResponse {
  int32 lease_duration_ms = 1;
  int32 heartbeat_interval_ms = 2;
}

message HeartbeatRequest {
  string worker_id = 1;
  repeated string active_job_ids = 2;
  WorkerStatus status = 3;
}

message HeartbeatResponse {}

message DeregisterRequest {
  string worker_id = 1;
}

message DeregisterResponse {}
