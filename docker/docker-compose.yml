services:
  redis:
    image: redis:7-alpine
    command: >
      redis-server --appendonly yes --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  feather-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    ports:
      - "50051:50051"
      - "8080:8080"
    environment:
      FEATHER_REDIS_URL: redis://redis:6379
      FEATHER_GRPC_ADDR: 0.0.0.0:50051
      FEATHER_HTTP_ADDR: 0.0.0.0:8080
    depends_on:
      redis:
        condition: service_healthy

  dashboard:
    profiles: ["dashboard"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    ports:
      - "3000:3000"
    environment:
      FEATHER_API_URL: http://feather-server:8080
      NEXT_PUBLIC_FEATHER_API_URL: http://localhost:8080
    depends_on:
      - feather-server

volumes:
  redis-data:
